<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>team_mh - مد / فك بريك</title>
<style>
  body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Cairo,system-ui,sans-serif;padding:16px}
  h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:12px;color:#94a3b8;margin:10px 0 4px}
  input,select{width:100%;box-sizing:border-box;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:9px 10px;font:inherit;min-height:40px}
  .acts{display:flex;gap:8px}
  .acts button{flex:1;padding:12px;border:1px solid #334155;border-radius:12px;background:#1e293b;color:#e2e8f0;font:inherit;font-weight:800;cursor:pointer}
  .acts button.on{background:#1d4ed8;border-color:#3b82f6}
  #msg{margin-top:12px;font-size:13px;min-height:20px;line-height:1.6}
  .ok{color:#4ade80}.err{color:#f87171}
  #send{width:100%;margin-top:14px;background:#16a34a;color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:900;cursor:pointer}
  #send:disabled{opacity:.5;cursor:default}
  #histBtn{width:100%;margin-top:10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:10px;font:inherit;font-weight:800;cursor:pointer}
  #histWrap table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
  #histWrap th,#histWrap td{border-bottom:1px solid #1e293b;padding:5px 4px;text-align:right;white-space:nowrap}
  #histWrap th{color:#94a3b8;font-weight:700}
  .st-ok{color:#4ade80}.st-bad{color:#f87171}.st-wait{color:#facc15}
  .sub{font-size:11px;color:#64748b;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<h2>⚡ مد الشيفت / فك البريك</h2>
<div class="acts">
  <button id="actExt" class="on" type="button">⏫ مد الشيفت</button>
  <button id="actBrk" type="button">☕ فك البريك</button>
  <button id="actOpen" type="button">🔓 فتح شيفت</button>
</div>
<label for="rider">كود المندوب</label>
<input id="rider" inputmode="numeric" placeholder="اكتب ID المندوب">
<label for="city">المدينة</label>
<select id="city">
  <option value="">اختار المدينة</option>
  <option>الإسكندرية</option>
  <option>الغردقة</option>
  <option>السويس</option>
  <option>الإسماعيلية</option>
  <option>المنصورة</option>
  <option>المنيا</option>
  <option>الزقازيق</option>
</select>
<div id="vehWrap" style="display:none">
  <label for="vehicle">رقم المركبة</label>
  <input id="vehicle" placeholder="اكتب رقم المركبة">
</div>
<div id="openReasonWrap" style="display:none">
  <label for="openReason">السبب</label>
  <input id="openReason" value="موجود في الزون">
</div>
<div id="durWrap">
  <label for="durSel" id="durLabel">وقت نهاية المد</label>
  <select id="durSel"></select>
  <input id="durTime" type="time" style="display:none">
</div>
<div id="reasonWrap" style="display:none">
  <label for="reason">سبب فك البريك</label>
  <select id="reason">
    <option value="">اختار السبب…</option>
    <option value="TEMP_NOT_WORKING">TEMP_NOT_WORKING</option>
    <option value="BREAK">BREAK</option>
  </select>
</div>
<button id="send" type="button">تأكيد وتنفيذ ✅</button>
<button id="stop" type="button" style="display:none;background:#7f1d1d;color:#fff">⛔ إيقاف</button>
<label for="spacing" style="margin-top:12px">⏱️ الفاصل بين الطلبات (ثواني، أقل حاجة 10)</label>
<input id="spacing" type="number" min="10" step="1" value="10" inputmode="numeric">
<button id="histBtn" type="button">📋 حالة الطلبات</button>
<div id="histWrap" style="display:none">
  <div style="display:flex;gap:8px;margin-top:10px">
    <select id="histAction"><option value="">كل العمليات</option><option value="extend">مد الشيفت</option><option value="break">فك البريك</option><option value="open">فتح شيفت</option></select>
    <select id="histCity"><option value="">كل المدن</option><option>الإسكندرية</option><option>الغردقة</option><option>السويس</option><option>الإسماعيلية</option><option>المنصورة</option><option>المنيا</option><option>الزقازيق</option></select>
  </div>
  <div id="histNote" class="sub"></div>
  <div style="max-height:260px;overflow:auto">
    <table><thead><tr><th>الوقت</th><th>الكود</th><th>العملية</th><th>المدينة</th><th>الإرسال</th><th>حالة القبول</th></tr></thead><tbody id="histBody"></tbody></table>
  </div>
</div>
<div id="msg"></div>
<div class="sub">الطلب بينفذ فورًا من اللابتوب ده في نافذة كروم حقيقية (زي أداة البايثون بالظبط)، والنتيجة بتظهر هنا وكإشعار. لو جوجل طلب تسجيل دخول، سجّل في النافذة اللي هتفتح مرة واحدة بس.</div>
<script>
const HOURS=[{h:0,l:'إلي 12:00 بليل'},{h:1,l:'إلي 01:00 الفجر'},{h:2,l:'إلي 02:00 الفجر'},{h:3,l:'إلي 03:00 الفجر'},{h:4,l:'إلي 04:00 الفجر'},{h:5,l:'إلي 05:00 الفجر'},{h:8,l:'إلي 08:00 الصبح'},{h:9,l:'إلي 09:00 الصبح'},{h:10,l:'إلي 10:00 الصبح'},{h:11,l:'إلي 11:00 الصبح'},{h:12,l:'إلي 12:00 الضهر'},{h:13,l:'إلي 01:00 الضهر'},{h:14,l:'إلي 02:00 الضهر'},{h:15,l:'إلي 03:00 الضهر'},{h:16,l:'إلي 04:00 العصر'},{h:17,l:'إلي 05:00 العصر'},{h:18,l:'إلي 06:00 بليل'},{h:19,l:'إلي 07:00 بليل'},{h:20,l:'إلي 08:00 بليل'},{h:21,l:'إلي 09:00 بليل'},{h:22,l:'إلي 10:00 بليل'},{h:23,l:'إلي 11:00 بليل'}];
const $=id=>document.getElementById(id);
let action='extend';
function isAlex(){return $('city').value==='الإسكندرية'}
function sync(){
  $('actExt').classList.toggle('on',action==='extend');
  $('actBrk').classList.toggle('on',action==='break');
  $('actOpen').classList.toggle('on',action==='open');
  const open=action==='open';
  $('durWrap').style.display=action==='extend'?'':'none';
  $('reasonWrap').style.display=(action==='break'&&isAlex())?'':'none';
  $('vehWrap').style.display=open?'':'none';
  $('openReasonWrap').style.display=open?'':'none';
  const alexTime=action==='extend'&&isAlex();
  $('durSel').style.display=alexTime?'none':'';
  $('durTime').style.display=alexTime?'':'none';
}
$('actExt').onclick=()=>{action='extend';sync()};
$('actBrk').onclick=()=>{action='break';sync()};
$('actOpen').onclick=()=>{action='open';sync()};
$('city').onchange=sync;
$('durSel').replaceChildren(new Option('اختار وقت نهاية المد…',''));HOURS.forEach(o=>$('durSel').add(new Option(o.l,o.l)));
sync();
const m=$('msg');
function say(cls,txt){m.className=cls;m.textContent=txt}
// Delay setting: load saved value, save on change (floor 10s, kept on disk).
window.tmhDesktop.getSettings().then(s=>{if(s&&s.spacingSec)$('spacing').value=s.spacingSec}).catch(()=>{});
$('spacing').onchange=()=>{window.tmhDesktop.setSpacing($('spacing').value).then(s=>{if(s&&s.spacingSec)$('spacing').value=s.spacingSec}).catch(()=>{})};
window.tmhDesktop.onProgress(info=>{
  if(!info||!info.stage)return;
  if(info.stage==='spacing')say('','⏳ ثواني حماية بين الطلبات: استنى '+info.seconds+' ثانية…');
  else if(info.stage==='launch')say('','🚀 بيفتح كروم…');
  else if(info.stage==='signin_wait')say('','🔐 سجّل دخول جوجل بالحساب '+info.email+' في نافذة كروم اللي فتحت - التنفيذ هيكمل لوحده');
  else if(info.stage==='walking')say('','⚡ بيملى الفورم في كروم… متقفلش النافذة');
});
$('send').onclick=async()=>{
  say('','');
  const rider=$('rider').value.trim(),city=$('city').value;
  if(!/^\d{1,15}$/.test(rider)){say('err','اكتب كود مندوب صحيح');return}
  if(!city){say('err','اختار المدينة');return}
  let duration='';
  if(action==='extend'){duration=isAlex()?$('durTime').value:$('durSel').value;if(!duration){say('err','اختار وقت نهاية المد');return}}
  let reason='';
  if(action==='break'&&isAlex()){reason=$('reason').value;if(!reason){say('err','اختار سبب فك البريك');return}}
  let vehicle='';
  if(action==='open'){
    if(isAlex()){say('err','فتح الشيفت متاح لمدن الدلتا بس (مش الإسكندرية)');return}
    vehicle=$('vehicle').value.trim();
    if(!vehicle){say('err','اكتب رقم المركبة');return}
    reason=$('openReason').value.trim()||'موجود في الزون';
  }
  $('send').disabled=true;
  $('stop').style.display='';
  say('','🚀 بيجهز التنفيذ…');
  try{
    const r=await window.tmhDesktop.runLocal({action,rider_id:rider,city,duration,reason,vehicle});
    if(r&&r.ok){
      say('ok','✅ تم: '+(action==='break'?'فك بريك':action==='open'?'فتح شيفت':'مد الشيفت')+' - '+rider);
      $('rider').value='';
    }else{
      const em=String((r&&r.error)||'unknown');
      const emap={
        busy:'في طلب شغال حاليًا - استنى ما يخلص',
        chrome_not_found:'مش لاقي جوجل كروم على الجهاز - نزّله الأول',
        auth_expired:'تسجيل دخول جوجل مخلصش في وقته - جرّب تاني وسجّل دخول أسرع',
        wrong_account:'الحساب المسجل في كروم مش حساب الفورم المطلوب - سجّل دخول بالحساب الصح من زرار تسجيل الدخول',
        tab_closed:'نافذة كروم اتقفلت قبل ما التنفيذ يخلص',
        tab_failed:'مش قادر أفتح تاب في كروم - قفل كروم وجرّب تاني',
        form_not_ready:'صفحة الفورم ماجهزتش - شيك النت وجرّب تاني',
        walk_exception:'حصل خطأ أثناء ملء الفورم - جرّب تاني، ولو تكرر ابعتلي سكرينشوت',
        validation_blocked:'الفورم رفض يكمل: في خانة مطلوبة مش متملية',
        page_load_failed:'صفحة الفورم معملتش تحميل - شيك النت وجرّب تاني',
        did_not_advance:'الفورم ماإكدش الإرسال (ممكن حجب مؤقت من جوجل) - جرّب بعد شوية',
        watchdog_timeout:'مش متأكد لو الطلب اتبعت (التنفيذ خد وقت طويل) - اتأكد من الشيت قبل ما تعيد',
        unconfirmed:'⚠️ غير مؤكد: ممكن الطلب يكون اتبعت - اتأكد من الشيت أو الجدول قبل ما تعيد',
        bad_rider:'اكتب كود مندوب صحيح',bad_city:'اختار المدينة',bad_duration:'اختار وقت نهاية المد',bad_reason:'اختار سبب فك البريك',bad_duration_format:'صيغة الوقت مش صح',
        bad_vehicle:'اكتب رقم المركبة',open_not_alex:'فتح الشيفت متاح لمدن الدلتا بس (مش الإسكندرية)',
        aborted:'⛔ اتوقف - الطلب اتلغى قبل الإرسال',
        upload_not_confirmed:'الإثبات مااترفعش - الصورة مش ظاهرة في الفورم، مافيش حاجة اتبعتت. جرّب تاني',
        upload_input_not_found:'نافذة رفع الإثبات مافتحتش - جرّب تاني'
      };
      say('err',(emap[em]||('فشل: '+em))+(r&&r.detail?(' — '+String(r.detail).slice(0,180)):''));
    }
  }catch(e){
    say('err','فشل الاتصال بالتطبيق - قفل النافذة وافتحها تاني');
  }finally{$('send').disabled=false;$('stop').style.display='none'}
};
$('stop').onclick=async()=>{
  $('stop').disabled=true;
  try{
    const r=await window.tmhDesktop.stopRun();
    if(r&&r.state==='submitted_uncertain')say('err','⚠️ الإرسال اتضغط بالفعل - الطلب اتبعت/غير مؤكد، اتأكد من الشيت قبل ما تعيد');
    else if(r&&r.state==='aborting')say('','⏳ بيتم الإيقاف…');
    else say('','مفيش طلب شغال دلوقتي');
  }catch(e){say('err','مش قادر أوصل لزرار الإيقاف - قفل النافذة وافتحها تاني')}
  finally{$('stop').disabled=false}
};
// ---- حالة الطلبات: local run history + live approval status from the response sheets.
let histOpen=false, histTimer=null;
const sheetCache={alex:[],delta:[]};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtTs(ts){const d=new Date(ts);return d.toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function sheetStatusFor(row){
  const rows=sheetCache[row.city==='الإسكندرية'?'alex':'delta']||[];
  let found=null;
  for(const r of rows){if(r.rider===row.riderId)found=r}
  return found;
}
async function refreshSheets(){
  for(const g of ['alex','delta']){
    try{
      const r=await window.tmhDesktop.sheetStatus(g);
      if(r&&r.ok)sheetCache[g]=r.rows||[];
      else if(r&&r.error==='no_access')sheetCache[g]='NO_ACCESS';
      // browser_off: Chrome for this group is closed - keep last data, stay quiet.
    }catch(e){}
  }
}
async function renderHistory(){
  const h=(await window.tmhDesktop.history().catch(()=>[]))||[];
  const fa=$('histAction').value, fc=$('histCity').value;
  const rows=h.slice().reverse().filter(r=>(!fa||r.action===fa)&&(!fc||r.city===fc)).slice(0,60);
  let note='';
  if(sheetCache.alex==='NO_ACCESS'||sheetCache.delta==='NO_ACCESS')note='⚠️ شيت الردود لسه مش متشارك مع حساب الفورم - حالة القبول هتظهر لما يتشارك (قراءة بس).';
  $('histNote').textContent=note;
  $('histBody').innerHTML=rows.map(r=>{
    const local=r.ok?'<span class="st-ok">✅ تم</span>':(r.error==='aborted'?'<span class="st-bad">⛔ اتوقف</span>':(r.uncertain?'<span class="st-wait">⚠️ غير مؤكد</span>':'<span class="st-bad">❌ '+esc(r.error||'فشل')+'</span>'));
    const sh=sheetStatusFor(r);
    let appr='<span class="st-wait">—</span>';
    if(sh&&sh.status){
      const s=sh.status;
      if(/مقبول|تم الرد|تم/.test(s)&&!/قيد/.test(s))appr='<span class="st-ok">'+esc(s)+'</span>';
      else if(/مرفوض|رفض/.test(s))appr='<span class="st-bad">'+esc(s)+(sh.rejectReason?' ('+esc(sh.rejectReason)+')':'')+'</span>';
      else appr='<span class="st-wait">'+esc(s)+'</span>';
    }
    return '<tr><td>'+fmtTs(r.ts)+'</td><td>'+esc(r.riderId)+'</td><td>'+(r.action==='break'?'☕ فك':r.action==='open'?'🔓 فتح':'⏫ مد')+'</td><td>'+esc(r.city)+'</td><td>'+local+'</td><td>'+appr+'</td></tr>';
  }).join('')||'<tr><td colspan="6" style="color:#64748b;text-align:center">لا طلبات لسه</td></tr>';
}
$('histBtn').onclick=async()=>{
  histOpen=!histOpen;
  $('histWrap').style.display=histOpen?'':'none';
  if(histOpen){
    $('histNote').textContent='⏳ بيحمّل…';
    await renderHistory();
    refreshSheets().then(renderHistory);
    histTimer=setInterval(async()=>{await refreshSheets();await renderHistory()},45000);
  }else if(histTimer){clearInterval(histTimer);histTimer=null}
};
$('histAction').onchange=renderHistory;
$('histCity').onchange=renderHistory;
</script>
</body>
</html>
